# Example ONLY — put real secrets in Streamlit Cloud > Settings > Secrets.
# Never commit your actual .streamlit/secrets.toml.

# Existing Cloudflare credentials (required to generate chat replies).
CLOUDFLARE_ACCOUNT_ID = "your-account-id"
CLOUDFLARE_API_TOKEN = "your-token"

# Only required to persist Chat Workspace after logout/restart/redeployment.
# Use a TLS-enabled hosted PostgreSQL database (e.g. Neon or Supabase).
ALBA_DATABASE_URL = "postgresql://user:password@your-host:5432/database?sslmode=require"

# Streamlit native OIDC authentication. Register
# https://YOUR-APP.streamlit.app/oauth2callback at the identity provider.
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_LONG_RANDOM_SECRET"

# Example: Google OIDC login (not Google AI Studio access).
# Microsoft Entra ID, Auth0 or other OIDC providers can be used instead.
[auth.google]
client_id = "YOUR_OIDC_CLIENT_ID"
client_secret = "YOUR_OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
