name: ALBA static validation

on:
  push:
    branches: [main, develop/alba-v2]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ToC and test dependencies
        run: python -m pip install -r requirements.txt 'reportlab>=4.0'
      - name: Check Python syntax, components and library references
        env:
          ALBA_HEADLESS_TEST: '1'
        run: python -m unittest discover -s tests -v
      - name: One-time EUR-Lex Cellar public API smoke test
        if: github.ref == 'refs/heads/develop/alba-v2'
        run: |
          python - <<'PY'
          from datetime import date
          from dataclasses import asdict
          from eurlex_cellar import probe_eurlex
          evidence, text = probe_eurlex("32010L0035", as_of=date(2026, 11, 12))
          print("CELLAR_OUTCOME", evidence.outcome, "CELEX", evidence.selected_consolidation)
          print("CELLAR_HEADER", repr(text[:1300]))
          PY
