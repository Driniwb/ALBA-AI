name: ALBA static validation

on:
  push:
    branches: [main, develop/alba-v2]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ToC and test dependencies
        run: python -m pip install -r requirements.txt 'reportlab>=4.0'
      - name: Check Python syntax, components and library references
        env:
          ALBA_HEADLESS_TEST: '1'
        run: python -m unittest discover -s tests -v
      - name: One-time EU law verification live smoke (read-only)
        if: github.ref == 'refs/heads/develop/alba-v2'
        run: |
          python - <<'PY'
          from datetime import date
          from eurlex_verification import verify_eurlex
          for act in ("32008L0068", "32010L0035", "32016L0798"):
              record = verify_eurlex(act, as_of=date(2026, 11, 12))
              print("LEGAL_GATE", act,
                    "outcome=", record.outcome,
                    "consolidated=", record.consolidated_celex,
                    "status=", record.in_force_flag,
                    "start=", record.entry_into_force,
                    "amendments=", len(record.observed_amendments),
                    "unmatched=", len(record.unmatched_amendment_citations),
                    "corrigendum_citations=", record.observed_corrigendum_citations,
                    "fully_verified=", record.full_legal_verification,
                    "reasons=", record.reasons[:3])
          PY
