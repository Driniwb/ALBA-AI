name: ALBA static validation

on:
  push:
    branches: [main, develop/alba-v2]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ToC and test dependencies
        run: python -m pip install -r requirements.txt 'reportlab>=4.0'
      - name: Check Python syntax, components and library references
        env:
          ALBA_HEADLESS_TEST: '1'
        run: python -m unittest discover -s tests -v
      - name: One-time read-only QBZ source retrieval pilot
        if: github.ref == 'refs/heads/develop/alba-v2'
        run: python legal_source_documents.py https://qbz.gov.al/eli/vendim/2023/05/31/325 --as-of 2026-11-12
