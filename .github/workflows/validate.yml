name: ALBA static validation

on:
  push:
    branches: [main, develop/alba-v2]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ToC and test dependencies
        run: python -m pip install -r requirements.txt 'reportlab>=4.0'
      - name: Check Python syntax, components and library references
        env:
          ALBA_HEADLESS_TEST: '1'
        run: python -m unittest discover -s tests -v
      - name: Temporary official OJ amendment and corrigendum discovery
        if: github.ref == 'refs/heads/develop/alba-v2'
        run: |
          python - <<'PY'
          from eurlex_cellar import _download_text
          import re
          for celex in ("32024L2749", "32024L2749R(01)"):
              try:
                  url, t=_download_text(celex,get=__import__('requests').get)
                  print("OJ_PROBE",celex,"URI",url,"CHARS",len(t),"HEAD",repr(t[:650]))
                  for pattern in (r"Article 3",r"Article 11",r"Article 12",r"On page 14",r"for:",r"read:"):
                      m=re.search(pattern,t,re.I)
                      if m:
                          print("OJ_SECTION",celex,pattern,repr(t[max(0,m.start()-50):m.start()+650]))
              except Exception as exc:
                  print("OJ_FAILURE",celex,type(exc).__name__,str(exc)[:180])
          PY
      - name: Temporary official corrigendum relation and ELI access probe
        if: github.ref == 'refs/heads/develop/alba-v2'
        run: |
          python - <<'PY'
          from eurlex_verification import relationships_query,_rows
          import requests
          base="32024L2749"
          try:
              rows=_rows(relationships_query(base),post=requests.post,row_limit=100)
              values=[(item.get("celex",{}).get("value"),item.get("predicate",{}).get("value","").split("#")[-1]) for item in rows]
              print("CORR_RELATIONS",base,values)
          except Exception as exc: print("CORR_RELATIONS_FAILED",type(exc).__name__,str(exc)[:180])
          for u in (
              "https://eur-lex.europa.eu/eli/dir/2024/2749/corrigendum/2025-04-22/oj/eng",
              "https://publications.europa.eu/resource/eli/dir/2024/2749/corrigendum/2025-04-22/oj",
          ):
              try:
                  r=requests.get(u,timeout=15,allow_redirects=False)
                  print("CORR_ACCESS",u,r.status_code,r.headers.get("Content-Type"),r.headers.get("Location","")[:150],len(r.content))
              except Exception as exc: print("CORR_ACCESS_FAILED",type(exc).__name__)
          PY
