name: ALBA static validation

on:
  push:
    branches: [main, develop/alba-v2]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ToC and test dependencies
        run: python -m pip install -r requirements.txt 'reportlab>=4.0'
      - name: Check Python syntax, components and library references
        env:
          ALBA_HEADLESS_TEST: '1'
        run: python -m unittest discover -s tests -v
      - name: Temporary live audit of four authentic corrigenda
        if: github.ref == 'refs/heads/develop/alba-v2'
        run: |
          python - <<'PY'
          from datetime import date
          from eurlex_corrigenda import review_amendment_corrigenda
          report=review_amendment_corrigenda(
              "32010L0035", "32024L2749",
              article="33c", paragraph="9",
              as_of=date(2026,11,12),
          )
          print("CORR_REPORT",report.outcome,
                "found",report.observed_corrigenda_count,
                "relevant",report.relevant_corrigenda,
                "unrelated",report.unrelated_corrigenda,
                "unresolved",report.unresolved_corrigenda,
                "exact_match",report.exact_correction_match_confirmed,
                "all_read",report.all_corrigendum_texts_retrieved,
                "full_legal_verification",report.full_legal_verification)
          for c in report.reviewed:
              print("CORR_ITEM",c.celex,c.outcome,"lang",c.language_confirmed,
                    "published",c.published_date,"target",c.target_base_celex,
                    c.target_article,c.target_paragraph,"relevant",
                    c.affects_requested_provision,"text_match",
                    c.corrected_text_matches_consolidation,"unresolved",
                    c.limitations[:1])
          PY
