name: ToC Word proof of concept

on:
  push:
    branches:
      - feature/toc-builder-word-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install prototype dependencies
        run: python -m pip install -r requirements.txt 'reportlab>=4.0'
      - name: Validate syntax and offline Word/PDF tests
        run: python -m unittest discover -s tests -v
