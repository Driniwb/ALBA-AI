name: ToC Word proof of concept

on:
  push:
    branches:
      - feature/toc-builder-word-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install prototype dependencies
        run: python -m pip install -r requirements.txt 'reportlab>=4.0'
      - name: Validate syntax and offline Word/PDF tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test actual Directive 2008/68/EC PDF (network-dependent)
        run: PYTHONPATH=. python tests/real_directive_smoke.py
      - name: Publish demonstrator Word ToC from public test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALBA-ToC-2008-68-Word-Demo
          path: artifacts/*
          if-no-files-found: ignore
          retention-days: 7
